<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HaseX</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="512x512" href="/hx.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/hx.png">

    <!-- Preload critical assets -->
    <link rel="preload" as="image" href="/hx.png" fetchpriority="high">

    <!-- Loading screen overlay ONLY - no global styles -->
    <style>
      #hasex-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        transition: opacity 0.3s ease-out;
      }

      #hasex-loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #hasex-loading-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        animation: hasex-pulse 2s ease-in-out infinite;
      }

      @keyframes hasex-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.8;
        }
      }

      #hasex-loading-text {
        color: #00f0ff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 2px;
        margin-top: 24px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <!-- Loading screen overlay - does NOT affect app styling -->
    <div id="hasex-loading-overlay">
      <img id="hasex-loading-logo" src="/hx.png" alt="HaseX Logo" width="120" height="120">
      <div id="hasex-loading-text">Loading HaseX</div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
